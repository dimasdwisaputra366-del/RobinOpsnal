<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Robinopsnal Bareskrim</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0b1220;
            color: #eef2f7;
            font-synthesis: none;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(212, 175, 55, 0.10), transparent 42%),
                #0b1220;
        }
        .login-card {
            width: min(100%, 420px);
            padding: 40px;
            border: 1px solid #26354b;
            border-radius: 18px;
            background: #121d2e;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }
        .brand-mark {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 15px;
            background: rgba(212, 175, 55, 0.10);
            color: #e1c15b;
            font-size: 21px;
            font-weight: 750;
            letter-spacing: 1px;
        }
        .eyebrow {
            margin: 0 0 8px;
            color: #d8b94f;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 0.2px; }
        .intro { margin: 9px 0 28px; color: #9ba9bc; font-size: 14px; line-height: 1.6; }
        .field { margin-bottom: 19px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #d6deea;
            font-size: 13px;
            font-weight: 600;
        }
        input {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #314158;
            border-radius: 9px;
            outline: none;
            background: #0c1524;
            color: #f3f6fa;
            font: inherit;
            font-size: 14px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }
        input::placeholder { color: #718096; }
        input:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        .alert {
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 1px solid #793b47;
            border-radius: 9px;
            background: rgba(153, 42, 58, 0.16);
            color: #ffb7c0;
            font-size: 13px;
            line-height: 1.5;
        }
        .submit-button {
            width: 100%;
            min-height: 47px;
            margin-top: 6px;
            border: 0;
            border-radius: 9px;
            background: #d4af37;
            color: #111827;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 150ms ease, transform 150ms ease;
        }
        .submit-button:hover { background: #e2c452; }
        .submit-button:active { transform: translateY(1px); }
        .submit-button:focus-visible { outline: 3px solid rgba(212, 175, 55, 0.35); outline-offset: 3px; }
        .footer {
            margin: 25px 0 0;
            padding-top: 18px;
            border-top: 1px solid #26354b;
            color: #748399;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-card { padding: 30px 24px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">R</div>
        <p class="eyebrow">Robinopsnal · Bareskrim Polri</p>
        <h1>Masuk ke sistem</h1>
        <p class="intro">Gunakan akun internal Anda untuk mengakses buku agenda surat.</p>

        {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="field">
                <label for="username">NRP / Username internal</label>
                <input id="username" type="text" name="username" placeholder="Masukkan username" required autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password akses</label>
                <input id="password" type="password" name="password" placeholder="Masukkan password" required autocomplete="current-password">
            </div>
            <button class="submit-button" type="submit">Masuk</button>
        </form>

        <p class="footer">Sistem Buku Agenda Surat Masuk<br>Biro Pembinaan dan Operasional Bareskrim Polri</p>
    </main>
</body>
</html>
